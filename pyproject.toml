[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webtester"
version = "0.1.0"
description = "Autonomous black-box web testing agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "webtester" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "playwright>=1.44",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-beautifulsoup4",
]
gemini = ["google-genai>=1.0"]

[project.scripts]
webtester = "webtester.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/webtester"]

[tool.hatch.build.targets.wheel.sources]
"src/webtester" = "webtester"

[tool.hatch.build.targets.sdist]
include = ["src/webtester", "README.md", "ARCHITECTURE.md", "benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: tests that need Playwright browsers",
  "e2e: end-to-end exploration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["webtester"]
mypy_path = "src"
