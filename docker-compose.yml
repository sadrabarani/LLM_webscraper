services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webtester
      POSTGRES_PASSWORD: webtester
      POSTGRES_DB: webtester
    ports:
      - "5432:5432"
    volumes:
      - webtester_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webtester -d webtester"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  webtester_pg:
